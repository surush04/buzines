# Frontend only. NestJS API + Groq AI must run on Render (see render.yaml).
# Netlify site settings:
#   Base directory: frontend
#   Environment: API_URL = https://buzines-api.onrender.com/api/v1

[build]
  base = "frontend"
  command = "node scripts/patch-env.mjs && npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"
  API_URL = "https://buzines-api-production.up.railway.app/api/v1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
