services:
  postgres:
    image: postgres:16-alpine
    container_name: abm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abm
      POSTGRES_PASSWORD: abm_secret
      POSTGRES_DB: ai_business_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: abm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
