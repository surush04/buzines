# Render Blueprint — https://render.com
# Deploy: Dashboard → New → Blueprint → connect GitHub repo → add GROQ_API_KEY
#
# IMPORTANT: use Blueprint (this file). Do NOT create a generic "Node Web Service"
# from repo root — Render will use Railpack and fail with "No start command".

services:
  - type: web
    name: buzines-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://buzines-web.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq

  - type: web
    name: buzines-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
