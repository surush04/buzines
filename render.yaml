# Free hosting on Render.com — https://render.com
# Steps: GitHub push → Render → New Blueprint → connect repo → add GROQ_API_KEY

services:
  - type: web
    name: buzines-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://buzines-web.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq

  - type: web
    name: buzines-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
